# Template only: render a verified private copy of the compatible legacy
# sources plus the reviewed observer. Do not point this at a v5/v6 runtime.
[Unit]
OnFailure=

[Service]
Slice=earthship-inputs.slice
Environment=EARTHSHIP_QUALIFICATION_FIT=0 EARTHSHIP_REMOTE_QUALIFICATION_FIT=0
Environment=OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
Environment=PYTHONDONTWRITEBYTECODE=1
ExecStart=
ExecStart=/usr/bin/timeout 90s /usr/bin/python3 @VERIFIED_LEGACY_SOURCES@/thermal_legacy_observe.py --config @VERIFIED_LEGACY_CONFIG@ --observe
TimeoutStartSec=95
SuccessExitStatus=75
CPUQuota=20%
MemoryMax=256M
MemorySwapMax=0
TasksMax=24
Nice=15
IOSchedulingClass=idle
IOWeight=10
OOMPolicy=kill
