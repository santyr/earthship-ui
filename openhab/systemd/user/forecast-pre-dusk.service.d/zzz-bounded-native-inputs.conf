[Unit]
OnFailure=

[Service]
Slice=earthship-inputs.slice
CPUQuota=20%
MemoryMax=256M
MemorySwapMax=0
TasksMax=24
IOWeight=10
Nice=15
IOSchedulingClass=idle
Environment=OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
ExecStart=
ExecStart=/usr/bin/flock --wait 20 --conflict-exit-code=75 /home/sat/.local/state/thermal-intel/native-input-consumers.lock /usr/bin/python3 /home/sat/openhab/scripts/forecast_pre_dusk.py
# Exhaustion must be visible; the next calendar check retries it.
SuccessExitStatus=
