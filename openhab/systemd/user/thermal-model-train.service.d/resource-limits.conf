# Protect the household host during the existing scheduled shadow trainer.
# Qualification fitting and full test suites belong on an off-host worker.
[Service]
CPUAccounting=yes
CPUQuota=25%
MemoryAccounting=yes
MemoryMax=768M
MemorySwapMax=0
TasksAccounting=yes
TasksMax=48
Nice=15
IOSchedulingClass=idle
IOAccounting=yes
IOWeight=10
OOMPolicy=kill
Environment=OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
