# Protect the household host during the existing scheduled shadow trainer.
# Run qualification/fitting serially within local resource limits and preflight.
[Service]
CPUAccounting=yes
CPUQuota=25%
MemoryAccounting=yes
MemoryMax=768M
MemorySwapMax=0
TasksAccounting=yes
TasksMax=48
Nice=15
IOSchedulingClass=idle
IOAccounting=yes
IOWeight=10
OOMPolicy=kill
Environment=OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
