# Wait for the existing capped thermal consumer without holding its lock.
# The210-second service budget includes90 seconds waiting and120 seconds work.
[Service]
ExecStart=
ExecStart=/usr/bin/flock --wait 90 --conflict-exit-code=75 /home/sat/.local/state/thermal-intel/native-input-consumers.lock /usr/bin/python3 /home/sat/openhab/scripts/forecast_intel.py json
TimeoutStartSec=210
# Exhaustion is a failed refresh, never a successfully updated forecast.
SuccessExitStatus=
