# The thermal consumer has a90-second bound. Wait without owning its lock.
# The daily job's full180-second budget includes this wait; caps are inherited.
[Service]
ExecStart=
ExecStart=/usr/bin/flock --wait 90 --conflict-exit-code=75 /home/sat/.local/state/thermal-intel/native-input-consumers.lock /usr/bin/python3 /home/sat/openhab/scripts/forecast_intel.py
TimeoutStartSec=180
# Exhaustion must be visible; it is not an issued forecast.
SuccessExitStatus=
