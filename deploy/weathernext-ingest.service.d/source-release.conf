[Service]
# Collector-only source pin; shadow inference/training keep runtime.env.
EnvironmentFile=%h/.config/earthship-weather/collector-release.env
ExecStart=
ExecStart=/usr/bin/python3 ${EARTHSHIP_WEATHER_COLLECTOR_CODE_ROOT}/scripts/run-household-job.py --production --collection --minimum-mib 256 --preferred-mib 256 --tasks 24 --seconds 90 -- ${EARTHSHIP_WEATHER_PYTHON} ${EARTHSHIP_WEATHER_COLLECTOR_CODE_ROOT}/openhab/scripts/weathernext_ingest.py --collect --archive ${EARTHSHIP_WEATHER_ARCHIVE}
