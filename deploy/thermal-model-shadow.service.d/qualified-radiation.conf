# Explicit current-input rollout only; not installed by the broad thermal manifest.
# This enables no training, day scoring, journal collector or household control.
[Service]
Environment="THERMAL_RADIATION_SHADOW_QUALIFIED_ENABLE=1"
Environment="THERMAL_RADIATION_DB_CONFIG=/home/sat/.config/hex/energy-power-reader.jdbc"
Environment="THERMAL_RADIATION_POLICY=/home/sat/.config/hex/weather-radiation-policy.json"
Environment="THERMAL_RADIATION_EVIDENCE_CUTOVER=2026-10-02T20:00:09.206165+00:00"
