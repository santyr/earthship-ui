[Service]
EnvironmentFile=%h/.config/earthship-weather/historical-release.env
Environment="PYTHONPATH=@RELEASE_ROOT@/openhab/scripts:/home/sat/Solar_PV/analytics/src"
ExecStart=
ExecStart=/usr/bin/python3 @RELEASE_ROOT@/scripts/run-household-job.py --production --minimum-mib 512 --preferred-mib 2048 --tasks 48 --seconds 900 -- /usr/bin/python3 @RELEASE_ROOT@/openhab/scripts/historical_weather_daily.py --code-revision @REVISION@
TimeoutStartSec=960
