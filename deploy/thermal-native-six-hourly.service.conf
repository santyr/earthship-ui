[Unit]
Description=Refresh native thermal learning through the latest six-hour cutoff

[Service]
WorkingDirectory=@RELEASE_ROOT@
Environment="PYTHONPATH=@RELEASE_ROOT@/openhab/scripts:/home/sat/Solar_PV/analytics/src"
ExecStart=
ExecStart=/usr/bin/python3 @RELEASE_ROOT@/openhab/scripts/household_job_run.py --production --minimum-mib 512 --preferred-mib 2048 --tasks 48 --seconds 1800 -- /usr/bin/python3 -m household_native_daily --config @CONFIG_PATH@
