# Private seven-service qualification profile. Queue the same work with fewer
# idle workers; preserve all providers, bindings and the aggregate task budget.
org.openhab.threadpool:common=2
org.openhab.threadpool:discovery=1
org.openhab.threadpool:file-processing=1
org.openhab.threadpool:mdns-addon-suggestion-finder=1
org.openhab.threadpool:thingManager=1
org.openhab.threadpool:safeCall=2
# Retain the supported default per-subscriber executors. The optional shared
# executor grows with queued callbacks and is unsuitable for this task budget.
org.openhab.threadpool:events=0
org.openhab.threadpool:items=2
# The installed DS component's configuration PID is its component name.
org.openhab.core.ui.internal.proxy.ProxyServletService:maxThreads=-
