# STAGED ONLY. Provisioning and activation each need explicit authorization.
name: earthship-sensors
services:
  chirpstack:
    image: chirpstack/chirpstack:4.19.2@sha256:cecb45bd2dfc9de55d32c620d6674093f859a899f4de36eb82924c7aa3bda8de
    profiles: [authorized-production]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: host
    command: [-c, /etc/chirpstack]
    volumes: ["../../.superpowers/lorawan-private/production/chirpstack:/etc/chirpstack:ro"]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    profiles: [authorized-production]
    ports: ["127.0.0.1:6394:6379"]
    command: [redis-server, /run/private/redis.conf]
    volumes: ["../../.superpowers/lorawan-private/production/redis.conf:/run/private/redis.conf:ro", "redis_data:/data"]
    restart: unless-stopped
  ingest:
    build: { context: ../.., dockerfile: services/lorawan/Dockerfile }
    image: earthship-observations:local
    profiles: [authorized-production]
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ../../.superpowers/lorawan-private/production/ingest.json:/run/private/ingest.json:ro
      - ./registry.production.json:/run/registry.json:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4.1.2@sha256:cc820a195e739fa653c6d7fd403abe73b9b0c79b5dd4ab0f4bf9c6443470121b
    profiles: [authorized-gateway]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: host
    command: [-c, /etc/chirpstack-gateway-bridge.toml]
    volumes:
      - ../../.superpowers/lorawan-private/production/gateway-bridge.toml:/etc/chirpstack-gateway-bridge.toml:ro
      - ../../.superpowers/lorawan-private/production/tls:/run/tls:ro
    restart: unless-stopped
  basicstation:
    image: "${RAK_BASICSTATION_IMAGE:-xoseperez/basicstation@sha256:cb67945c657012c67145dccdd756baf9a16ba095142cd458db2a5ef9ba97ca10}"
    profiles: [authorized-gateway]
    network_mode: host
    devices: ["${RAK_USB_DEVICE:-/dev/earthship-lora}:/dev/ttyACM0"]
    environment:
      MODEL: RAK5146
      INTERFACE: USB
      DEVICE: /dev/ttyACM0
      GATEWAY_EUI: "${GATEWAY_EUI:-COMMISSION_BEFORE_USE}"
      USE_CUPS: "0"
    volumes: ["../../.superpowers/lorawan-private/production/station:/app/config"]
    restart: unless-stopped
volumes:
  redis_data:
