[logging]
level="info"
[postgresql]
dsn="$POSTGRES_DSN"
max_open_connections=5
[redis]
servers=["$REDIS_URL"]
[network]
net_id="000000"
enabled_regions=["us915_1"]
[api]
bind="$API_BIND"
secret="$API_SECRET"
[integration]
enabled=["mqtt"]
[integration.mqtt]
server="$MQTT_SERVER"
username="$MQTT_USERNAME"
password="$MQTT_PASSWORD"
json=true
qos=1
