# Source validation only: never deploy or contact household services from CI.
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTEST_ADDOPTS: "-ra"
      EARTHSHIP_REMOTE_QUALIFICATION_FIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Install pinned workflow validator
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate every GitHub Actions workflow
        run: actionlint -color=false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provisional thermal UI contract
        run: node scripts/test-provisional-thermal-ui.mjs
      - run: npx vitest run
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Make disposable launchers meet runtime provenance permissions
        shell: bash
        run: |
          set -euo pipefail
          ci_python_path="$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          # setup-python's tool cache may be group-writable; production binding
          # intentionally rejects that. Tighten this ephemeral runner, not policy.
          sudo chmod go-w "$ci_python_path"
          stat --format='%a %U %n' "$ci_python_path"
          ci_java_path="$(readlink -f "$(command -v java)")"
          sudo chmod go-w "$ci_java_path"
          stat --format='%a %U %n' "$ci_java_path"
      - name: Fetch pinned companion library for Python tests
        uses: actions/checkout@v4
        with:
          repository: santyr/Solar_PV
          ref: 24d2e8984810cb596fe9792768510a356786f709
          path: .ci/solar-pv
          persist-credentials: false
      - name: Fetch pinned BMS auxiliary consumer qualification profile
        uses: actions/checkout@v4
        with:
          repository: santyr/Solar_PV
          ref: 7b70117bcfb9599a12d0325771ed1103f083fa5c
          path: .ci/solar-pv-bms-aux
          persist-credentials: false
      - name: Verify disposable PostgreSQL image availability
        timeout-minutes: 3
        run: |
          docker version
          # Google's public Docker Hub cache avoids shared-runner Hub limits.
          timeout 120s docker pull mirror.gcr.io/library/postgres:16
          docker tag mirror.gcr.io/library/postgres:16 postgres:16
      - name: Completion regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/openhab/scripts:${{ github.workspace }}/.ci/solar-pv/analytics/src:${{ github.workspace }}/.ci/solar-pv/analytics/tests
        run: python -m pytest tests/completion/ -q
      - name: Operational tooling regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/openhab/scripts:${{ github.workspace }}/.ci/solar-pv/analytics/src:${{ github.workspace }}/.ci/solar-pv/analytics/tests
        run: python -m pytest scripts/ -q

  openhab:
    name: OpenHAB tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTEST_ADDOPTS: "-ra"
      EARTHSHIP_REMOTE_QUALIFICATION_FIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Make disposable launchers meet runtime provenance permissions
        shell: bash
        run: |
          set -euo pipefail
          ci_python_path="$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          # setup-python's tool cache may be group-writable; production binding
          # intentionally rejects that. Tighten this ephemeral runner, not policy.
          sudo chmod go-w "$ci_python_path"
          stat --format='%a %U %n' "$ci_python_path"
          ci_java_path="$(readlink -f "$(command -v java)")"
          sudo chmod go-w "$ci_java_path"
          stat --format='%a %U %n' "$ci_java_path"
      - name: Fetch pinned companion library for Python tests
        uses: actions/checkout@v4
        with:
          repository: santyr/Solar_PV
          ref: 24d2e8984810cb596fe9792768510a356786f709
          path: .ci/solar-pv
          persist-credentials: false
      - name: Fetch pinned BMS auxiliary consumer qualification profile
        if: matrix.shard == 2
        uses: actions/checkout@v4
        with:
          repository: santyr/Solar_PV
          ref: 7b70117bcfb9599a12d0325771ed1103f083fa5c
          path: .ci/solar-pv-bms-aux
          persist-credentials: false
      - name: Verify disposable PostgreSQL image availability
        timeout-minutes: 3
        run: |
          docker version
          # Google's public Docker Hub cache avoids shared-runner Hub limits.
          timeout 120s docker pull mirror.gcr.io/library/postgres:16
          docker tag mirror.gcr.io/library/postgres:16 postgres:16
      - name: Existing OpenHAB Python tests (disjoint file partition)
        env:
          PYTHONPATH: ${{ github.workspace }}/openhab/scripts:${{ github.workspace }}/.ci/solar-pv/analytics/src:${{ github.workspace }}/.ci/solar-pv/analytics/tests
          TEST_SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(python - <<'PYFILES'
          from hashlib import sha256
          from pathlib import Path
          import os
          shard = int(os.environ['TEST_SHARD'])
          for path in sorted(Path('openhab/scripts').rglob('*.py')):
              if path.name.startswith('test_') or path.name.endswith('_test.py'):
                  if int(sha256(path.as_posix().encode()).hexdigest(), 16) % 3 == shard:
                      print(path.as_posix())
          PYFILES
          )
          test "${#test_files[@]}" -gt 0
          # Keep the normal disjoint hash assignment. This one cross-repo
          # integration contract uses its own immutable consumer/SQL profile
          # in a fresh process; never mix companion modules between profiles.
          general_files=()
          bms_aux_file=''
          for test_file in "${test_files[@]}"; do
            if [[ "$test_file" == 'openhab/scripts/test_bms_aux_producer_consumer_postgres.py' ]]; then
              bms_aux_file="$test_file"
            else
              general_files+=("$test_file")
            fi
          done
          general_status=0
          if [[ "${#general_files[@]}" -gt 0 ]]; then
            python -m pytest -q "${general_files[@]}" || general_status=$?
          fi
          bms_aux_status=0
          if [[ -n "$bms_aux_file" ]]; then
            PYTHONPATH="$GITHUB_WORKSPACE/openhab/scripts:$GITHUB_WORKSPACE/.ci/solar-pv-bms-aux/analytics/src:$GITHUB_WORKSPACE/.ci/solar-pv-bms-aux/analytics/tests" \
              python -m pytest -q "$bms_aux_file" || bms_aux_status=$?
          fi
          printf 'general_pytest_exit=%s bms_aux_pytest_exit=%s\n' "$general_status" "$bms_aux_status"
          [[ "$general_status" -eq 0 && "$bms_aux_status" -eq 0 ]]

  weathernext-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-weathernext.txt
      - run: python -m pip install -r requirements-weathernext.txt
      - name: Pinned WeatherNext SDK contracts without cloud access
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/openhab/scripts:${{ github.workspace }}/openhab/scripts/weather_learning/tests
        # Every test file retains its normal disjoint OpenHAB shard. This
        # minimal environment owns the SDK cases skipped without Earth Engine
        # in those general test environments.
        run: |
          python -m unittest -v \
            test_ee.SDKInitializationTests \
            test_ee.NativeProjectionTests \
            test_ee.WorkerCredentialScopesTests \
            test_capability_sdk.CapabilitySDKTests

  nak-authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify the pinned release candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 \
            'https://github.com/fiatjaf/nak/releases/download/v0.20.7/nak-v0.20.7-linux-amd64' \
            --output "$RUNNER_TEMP/nak-download"
          printf '%s  %s\n' \
            'ba918fafd1b030bc50958a5b218c6386f4c3a57c1e469562d3947e858e0ba56e' \
            "$RUNNER_TEMP/nak-download" | sha256sum --check --strict
          sudo install -o root -g root -m 755 "$RUNNER_TEMP/nak-download" "$RUNNER_TEMP/nak-qualification"
      - name: Real cryptographic checks without network access or household keys
        shell: bash
        run: |
          set -euo pipefail
          python="$(command -v python)"
          sudo unshare --net -- "$python" scripts/qualify-thermal-nak.py \
            --nak "$RUNNER_TEMP/nak-qualification"

  browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      - name: General console browser fixtures without upstream network
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        shell: bash
        run: |
          set -euo pipefail
          ci_node="$(command -v node)"
          ci_npm="$(command -v npm)"
          sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH unshare --net -- sh -c \
            'ip link set lo up; cd "$1"; exec "$2" "$3" run test:e2e -- --workers=2' \
            _ "$GITHUB_WORKSPACE" "$ci_node" "$ci_npm"
