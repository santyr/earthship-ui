# Source validation only: never deploy or contact household services from CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Completion regression tests
        run: python -m pytest tests/completion/ -q
      - name: Existing OpenHAB Python tests (including disposable PostgreSQL)
        run: python -m pytest openhab/scripts/ -q
      - name: Fetch pinned companion library for operational tooling
        uses: actions/checkout@v4
        with:
          repository: santyr/Solar_PV
          ref: d24771b77de540f32e592a7c44a0bff6385e8cd4
          path: .ci/solar-pv
          persist-credentials: false
      - name: Operational tooling regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/openhab/scripts:${{ github.workspace }}/.ci/solar-pv/analytics/src
        run: python -m pytest scripts/ -q

  nak-authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify the pinned release candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 \
            'https://github.com/fiatjaf/nak/releases/download/v0.20.7/nak-v0.20.7-linux-amd64' \
            --output "$RUNNER_TEMP/nak-download"
          printf '%s  %s\n' \
            'ba918fafd1b030bc50958a5b218c6386f4c3a57c1e469562d3947e858e0ba56e' \
            "$RUNNER_TEMP/nak-download" | sha256sum --check --strict
          sudo install -o root -g root -m 755 "$RUNNER_TEMP/nak-download" "$RUNNER_TEMP/nak-qualification"
      - name: Real cryptographic checks without network access or household keys
        shell: bash
        run: |
          set -euo pipefail
          python="$(command -v python)"
          sudo unshare --net -- "$python" scripts/qualify-thermal-nak.py \
            --nak "$RUNNER_TEMP/nak-qualification"
