name: Distributed sensor qualification
on:
  push:
    branches: [main, 'release/**']
  release:
    types: [published]
  pull_request:
    paths:
      - 'services/**'
      - 'deploy/lorawan/**'
      - 'openhab/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'playwright.config.js'
      - 'vite.config.js'
      - 'requirements*.txt'
      - '.github/workflows/sensors.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest==8.3.5
      - run: PYTHONPATH=.:openhab/scripts python -m pytest services/lorawan/tests openhab/scripts/test_household_sensor_observations.py
  software-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
          LOCAL_UID=$(id -u)
          LOCAL_GID=$(id -g)
          export LOCAL_UID LOCAL_GID
          python -m venv --system-site-packages /tmp/earthship-sensor-test-venv
          /tmp/earthship-sensor-test-venv/bin/pip install pytest==8.3.5 -r services/lorawan/requirements.txt
          python -m services.lorawan.provision
          curl -fL https://openhab.jfrog.io/artifactory/libs-release-local/org/openhab/distro/openhab-addons/5.2.1/openhab-addons-5.2.1.kar -o .superpowers/lorawan-private/addons/openhab-addons-5.2.1.kar
          chmod 644 .superpowers/lorawan-private/addons/*.kar
          docker compose -f deploy/lorawan/compose.test.yaml --profile chirpstack up -d --build --wait
      - run: SENSOR_INTEGRATION=1 PYTHONPATH=.:openhab/scripts /tmp/earthship-sensor-test-venv/bin/python -m pytest services/lorawan/tests/test_integration.py
      - run: SENSOR_INTEGRATION=1 npm run test:e2e:sensors
      - if: always()
        run: docker compose -f deploy/lorawan/compose.test.yaml --profile chirpstack down -v
